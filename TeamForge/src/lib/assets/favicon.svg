<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <title>Project-Sync</title>
  <style>
    .tile { fill: #A8481B; }
    .glyph { stroke: #FFFFFF; }
    .node { fill: #FFFFFF; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #E88A50; }
      .glyph { stroke: #14100A; }
      .node { fill: #14100A; }
    }
  </style>
  <!-- Chamfered tile, the brand shape. -->
  <path class="tile" d="M12 0H60a4 4 0 0 1 4 4V52L52 64H4a4 4 0 0 1-4-4V12Z" />
  <!-- Two arrows chasing round a project node: a project kept in sync. -->
  <g transform="translate(32 32) scale(1.22) translate(-32 -32)">
  <g class="glyph" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M17.6 29.2A14.6 14.6 0 0 1 44.2 24" />
    <path d="M45 18.4 44.2 24 38.6 22" />
    <path d="M46.4 34.8A14.6 14.6 0 0 1 19.8 40" />
    <path d="M19 45.6 19.8 40 25.4 42" />
  </g>
  <circle class="node" cx="32" cy="32" r="4.6" />
  </g>
</svg>
